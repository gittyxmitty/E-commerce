<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clothing | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">Clothing<span>.</span></div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">🛒 Cart</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <div class="shop-header">
      <h1>All Products</h1>
      <div class="filters">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Hoodies</button>
        <button class="filter-btn">Tees</button>
        <button class="filter-btn">Jackets</button>
        <button class="filter-btn">Accessories</button>
      </div>
    </div>

    <div class="products">
      <a href="product.html" class="product-card">
        <img src="https://loremflickr.com/400/500/hoodie" alt="Hoodie" />
        <div class="product-info">
          <span class="product-tag">New</span>
          <h3>Oversized Hoodie</h3>
          <span class="price">$45</span>
        </div>
      </a>

      <a href="product.html" class="product-card">
        <img src="https://loremflickr.com/400/500/tshirt" alt="Tee" />
        <div class="product-info">
          <span class="product-tag">Bestseller</span>
          <h3>Graphic Tee</h3>
          <span class="price">$25</span>
        </div>
      </a>

      <a href="product.html" class="product-card">
        <img src="https://loremflickr.com/400/500/denim,jacket" alt="Jacket" />
        <div class="product-info">
          <span class="product-tag">Limited</span>
          <h3>Denim Jacket</h3>
          <span class="price">$60</span>
        </div>
      </a>

      <a href="product.html" class="product-card">
        <img src="https://loremflickr.com/400/500/cap" alt="Cap" />
        <div class="product-info">
          <h3>Street Cap</h3>
          <span class="price">$18</span>
        </div>
      </a>

      <a href="product.html" class="product-card">
        <img src="https://loremflickr.com/400/500/joggers" alt="Joggers" />
        <div class="product-info">
          <span class="product-tag">New</span>
          <h3>Slim Joggers</h3>
          <span class="price">$38</span>
        </div>
      </a>

      <a href="product.html" class="product-card">
        <img src="https://loremflickr.com/400/500/sneakers" alt="Sneakers" />
        <div class="product-info">
          <h3>Canvas Sneakers</h3>
          <span class="price">$55</span>
        </div>
      </a>
    </div>

    <footer>&copy; 2026 Clothing. All rights reserved.</footer>
  </body>
</html>
