<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clothing | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">Clothing<span>.</span></div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">🛒 Cart</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <div class="promo-banner">
      ✨ Free shipping on orders over $50 — use code FRESH10 for 10% off
    </div>

    <section class="hero">
      <h1>Wear What <span>Feels Bold.</span></h1>
      <p>Fresh drops, vibrant styles, minimal fuss.</p>
      <a href="shop.html" class="btn">Shop Now</a>
    </section>

    <section class="categories">
      <h2>Shop by Category</h2>
      <div class="category-grid">
        <a href="shop.html" class="category-card">
          <img src="https://loremflickr.com/400/300/hoodie" alt="Hoodies" />
          <div class="category-label">Hoodies</div>
        </a>
        <a href="shop.html" class="category-card">
          <img src="https://loremflickr.com/400/300/tshirt" alt="Tees" />
          <div class="category-label">T-Shirts</div>
        </a>
        <a href="shop.html" class="category-card">
          <img
            src="https://loremflickr.com/400/300/denim,jacket"
            alt="Jackets"
          />
          <div class="category-label">Jackets</div>
        </a>
        <a href="shop.html" class="category-card">
          <img
            src="https://loremflickr.com/400/300/cap,fashion"
            alt="Accessories"
          />
          <div class="category-label">Accessories</div>
        </a>
      </div>
    </section>

    <footer>&copy; 2026 Clothing. All rights reserved.</footer>
  </body>
</html>
